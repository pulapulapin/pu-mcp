<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="#172431" role="img" aria-labelledby="title desc">
  <title id="title">PuKnowledge preview before save</title>
  <desc id="desc">Synthetic project demonstration showing an exact diff and authorization gate before a snapshot write.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1600" y2="1000"><stop stop-color="#f7f4ed"/><stop offset="1" stop-color="#edf1f5"/></linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#20364a" flood-opacity=".15"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#657381}.small{font-size:22px}.label{font-size:20px;font-weight:650;letter-spacing:.08em}.title{font-size:60px;font-weight:650;letter-spacing:-.045em}.hair{stroke:#d7dee5;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#stage)"/>
  <text x="90" y="76" class="label" fill="#496177">PUKNOWLEDGE · SYNTHETIC WORKFLOW DEMONSTRATION</text>
  <text x="90" y="150" class="title">Preview before persistence.</text>
  <text x="90" y="194" class="small muted">The exact baseline and change are visible before any write is authorized.</text>
  <rect x="90" y="248" width="1420" height="650" rx="34" fill="#fff" filter="url(#card)"/>
  <rect x="90" y="248" width="1420" height="92" rx="34" fill="#172b3b"/>
  <path d="M90 306h1420v34H90z" fill="#172b3b"/>
  <circle cx="140" cy="294" r="12" fill="#d86b4f"/><circle cx="178" cy="294" r="12" fill="#e3b95e"/><circle cx="216" cy="294" r="12" fill="#61a6da"/>
  <text x="260" y="303" class="mono small" fill="#eaf0f4">task_preview_snapshot · acceptance-alpha</text>
  <rect x="1294" y="270" width="166" height="48" rx="24" fill="#314b60"/>
  <text x="1322" y="301" font-size="19" font-weight="650" fill="#d9e4eb">NOT SAVED</text>
  <text x="142" y="405" class="label muted">BASELINE</text><text x="322" y="405" font-size="25" font-weight="650">revision 0</text>
  <text x="740" y="405" class="label muted">TARGET</text><text x="876" y="405" font-size="25" font-weight="650">revision 1</text>
  <text x="1170" y="405" class="label muted">CANON</text><text x="1300" y="405" font-size="25" font-weight="650" fill="#b55743">false</text>
  <line x1="142" y1="445" x2="1458" y2="445" class="hair"/>
  <rect x="142" y="484" width="1316" height="244" rx="18" fill="#111e29"/>
  <text x="178" y="530" class="mono small" fill="#8fa2b1">@@ task handoff @@</text>
  <rect x="160" y="555" width="1280" height="48" rx="8" fill="#18392f"/>
  <text x="178" y="587" class="mono small" fill="#a7dfc8">+ task_id: HOST-ACCEPTANCE-001</text>
  <rect x="160" y="611" width="1280" height="48" rx="8" fill="#18392f"/>
  <text x="178" y="643" class="mono small" fill="#a7dfc8">+ next_step: Open a new agent session and recover this task.</text>
  <rect x="160" y="667" width="1280" height="40" rx="8" fill="#18392f"/>
  <text x="178" y="694" class="mono" font-size="19" fill="#a7dfc8">+ approval_verified: false · canon: false</text>
  <rect x="142" y="770" width="770" height="76" rx="16" fill="#f7f1e2" stroke="#e4cf9e" stroke-width="2"/>
  <circle cx="184" cy="808" r="12" fill="#c18b27"/>
  <text x="214" y="816" font-size="23" font-weight="620" fill="#765716">Waiting for explicit user authorization</text>
  <rect x="1167" y="770" width="291" height="76" rx="16" fill="#dbe9f4"/>
  <text x="1221" y="816" font-size="23" font-weight="680" fill="#245d87">AUTHORIZE SAVE</text>
  <text x="90" y="956" class="small muted">Preview fingerprint is bound to the baseline · Stale revisions stop instead of overwriting</text>
</svg>
