<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="#172431" role="img" aria-labelledby="title desc">
  <title id="title">PuKnowledge project isolation</title>
  <desc id="desc">Synthetic project demonstration showing a session restored in Alpha and rejected in Beta without fallback.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1600" y2="1000"><stop stop-color="#f7f4ed"/><stop offset="1" stop-color="#e9eff4"/></linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#20364a" flood-opacity=".14"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#657381}.small{font-size:22px}.label{font-size:20px;font-weight:650;letter-spacing:.08em}.title{font-size:60px;font-weight:650;letter-spacing:-.045em}.hair{stroke:#d7dee5;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#stage)"/>
  <text x="90" y="76" class="label" fill="#496177">PUKNOWLEDGE · SYNTHETIC WORKFLOW DEMONSTRATION</text>
  <text x="90" y="150" class="title">No cross-project fallback.</text>
  <text x="90" y="194" class="small muted">The same session identifier never becomes permission to read another project's handoff.</text>
  <rect x="90" y="248" width="690" height="650" rx="34" fill="#fff" filter="url(#card)"/>
  <rect x="820" y="248" width="690" height="650" rx="34" fill="#fff" filter="url(#card)"/>
  <rect x="90" y="248" width="690" height="105" rx="34" fill="#173044"/><path d="M90 318h690v35H90z" fill="#173044"/>
  <rect x="820" y="248" width="690" height="105" rx="34" fill="#3a2926"/><path d="M820 318h690v35H820z" fill="#3a2926"/>
  <circle cx="144" cy="301" r="13" fill="#61a6da"/><text x="174" y="310" font-size="28" font-weight="650" fill="#fff">acceptance-alpha</text>
  <circle cx="874" cy="301" r="13" fill="#d86b4f"/><text x="904" y="310" font-size="28" font-weight="650" fill="#fff">acceptance-beta</text>
  <text x="142" y="414" class="label muted">REQUESTED SESSION</text><text x="142" y="457" class="mono small">host-acceptance</text>
  <text x="872" y="414" class="label muted">REQUESTED SESSION</text><text x="872" y="457" class="mono small">host-acceptance</text>
  <line x1="142" y1="493" x2="728" y2="493" class="hair"/><line x1="872" y1="493" x2="1458" y2="493" class="hair"/>
  <rect x="142" y="532" width="142" height="48" rx="24" fill="#e1f3ec"/>
  <text x="176" y="564" font-size="21" font-weight="700" fill="#2c7a62">READY</text>
  <text x="142" y="646" class="label muted">RESTORED TASK</text><text x="142" y="692" class="mono" font-size="25" font-weight="650">HOST-ACCEPTANCE-001</text>
  <text x="142" y="752" class="label muted">REVISION</text><text x="142" y="796" font-size="29" font-weight="650">1</text>
  <rect x="872" y="532" width="160" height="48" rx="24" fill="#f7e7e2"/>
  <text x="906" y="564" font-size="21" font-weight="700" fill="#a24b38">BLOCKED</text>
  <text x="872" y="646" class="label muted">RESULT</text>
  <text x="872" y="690" font-size="28" font-weight="650">Session does not exist.</text>
  <text x="872" y="728" class="small muted">No fallback to another project or task.</text>
  <rect x="872" y="772" width="586" height="74" rx="16" fill="#f5f6f7"/>
  <text x="906" y="818" class="mono small" fill="#526776">alpha task fields exposed: NO</text>
  <path d="M784 535v196" stroke="#a8b4be" stroke-width="3" stroke-dasharray="9 10"/>
  <rect x="747" y="612" width="74" height="48" rx="24" fill="#f7f4ed" stroke="#a8b4be" stroke-width="2"/>
  <path d="M776 632h16M776 640h16" stroke="#5f6e7b" stroke-width="3" stroke-linecap="round"/>
  <text x="90" y="956" class="small muted">Synthetic fixtures · Separate project scopes · Explicit rejection is a successful isolation result</text>
</svg>
